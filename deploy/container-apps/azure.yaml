# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: tidewatch
metadata:
  template: tidewatch@1.0.0
infra:
  provider: bicep
  path: infra
services:
  ingestion:
    project: ../../src/Tidewatch.Ingestion
    language: dotnet
    host: containerapp
    docker:
      # path is relative to project; context is the repo root (Dockerfiles pull in
      # Tidewatch.Contracts, which lives two levels up from the service project).
      path: Dockerfile
      context: ../..
  simulator:
    project: ../../src/Tidewatch.Source
    language: dotnet
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
  dashboard:
    project: ../../frontend
    language: js
    host: staticwebapp
    dist: dist/tidewatch-dashboard/browser
    # The Angular build ships config.json with the <INGESTION_FQDN> sentinel. After
    # packaging (build done, dist exists) and before upload, swap it for the real
    # ingestion FQDN that bicep exports as the INGESTION_FQDN azd output. The build stays
    # origin-agnostic; only the SWA deploy gets the cross-origin API base baked in.
    hooks:
      postpackage:
        posix:
          shell: sh
          run: sed -i "s|https://<INGESTION_FQDN>|https://${INGESTION_FQDN}|" dist/tidewatch-dashboard/browser/config.json
        windows:
          shell: pwsh
          run: (Get-Content dist/tidewatch-dashboard/browser/config.json) -replace 'https://<INGESTION_FQDN>', "https://$env:INGESTION_FQDN" | Set-Content dist/tidewatch-dashboard/browser/config.json
