apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: tidewatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: tidewatch-simulator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tidewatch-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
