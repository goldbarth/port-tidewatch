apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: tidewatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: tidewatch-ingestion:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tidewatch-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: tidewatch
spec:
  selector:
    app: ingestion
  ports:
    - port: 8080
      targetPort: 8080
