apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tidewatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/goldbarth/port-tidewatch
    targetRevision: main
    path: deploy/k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: tidewatch
  syncPolicy:
    automated:
      prune: true     # remove resources deleted from git
      selfHeal: true  # revert manual drift back to git state
    syncOptions:
      - CreateNamespace=true
